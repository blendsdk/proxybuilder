# Default ACME challenge server — managed by proxybuilder
# Serves Let's Encrypt HTTP-01 challenges for all domains before
# their individual site configs are created (solves the chicken-and-egg
# problem where the cert is needed before the site config can be rendered).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt ACME challenge
    include %proxyFolder%/letsencrypt.conf;

    # Return 444 (no response) for everything else
    location / {
        return 444;
    }
}
